<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaborUrbano - Acceso Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-orange-500 rounded-2xl flex items-center justify-center text-white font-black text-2xl mx-auto shadow-lg shadow-orange-500/30">
                SU
            </div>
            <h1 class="text-2xl font-bold">Acceso al Sistema</h1>
            <p class="text-xs text-slate-400">Ingresá tus credenciales para continuar</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-slate-400 block mb-1">Correo Electrónico</label>
                <div class="relative">
                    <input type="email" id="email" required placeholder="tu-correo@saborurbano.com" class="w-full p-3 rounded-xl border border-slate-700 bg-slate-900 text-sm pl-10 focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-400">Contraseña</label>
                    <button type="button" id="btn-toggle-forgot" class="text-xs text-orange-400 hover:text-orange-300 transition font-medium">¿Olvidaste tu contraseña?</button>
                </div>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" class="w-full p-3 rounded-xl border border-slate-700 bg-slate-900 text-sm pl-10 focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                </div>
            </div>

            <p id="error-msg" class="text-xs text-rose-500 hidden font-semibold text-center leading-relaxed"></p>

            <button type="submit" id="btn-submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm flex items-center justify-center space-x-2">
                <span>Ingresar</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
    </div>

    <!-- Modal Recuperar Contraseña -->
    <div id="forgot-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-sm">Recuperar Contraseña</h3>
                <button id="btn-close-forgot" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-slate-400">Ingresá tu mail y te enviaremos un enlace para restablecer tu contraseña.</p>
            <div>
                <label class="text-xs font-semibold text-slate-400 block mb-1">Correo Electrónico</label>
                <input type="email" id="reset-email" placeholder="tu-correo@saborurbano.com" class="w-full p-2.5 rounded-xl border border-slate-700 bg-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            <p id="reset-status" class="text-xs hidden font-semibold text-center"></p>
            <button id="btn-reset" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs transition">
                Enviar Enlace
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oyeyjkremybtncegobnq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95ZXlqa3JlbXlidG5jZWdvYm5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTAxOTUsImV4cCI6MjEwNzY2NjE5NX0.OHl0bNW9VMLGn1CI5V6b4uLW4tQD-Obc9yJqmpAqzro';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('btn-submit');

            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<span>Verificando...</span>';

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                const { data: userCheck, error: roleErr } = await _supabase
                    .from('admins')
                    .select('rol')
                    .eq('email', email)
                    .maybeSingle();

                if (roleErr || !userCheck) {
                    await _supabase.auth.signOut();
                    throw new Error('Tu correo no tiene permisos en el sistema.');
                }

                if (userCheck.rol === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'empleados.html';
                }

            } catch (err) {
                errorEl.innerText = err.message || 'Credenciales inválidas';
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Ingresar</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        });

        const toggleModal = () => document.getElementById('forgot-modal').classList.toggle('hidden');
        document.getElementById('btn-toggle-forgot').addEventListener('click', toggleModal);
        document.getElementById('btn-close-forgot').addEventListener('click', toggleModal);

        document.getElementById('btn-reset').addEventListener('click', async () => {
            const email = document.getElementById('reset-email').value.trim();
            const statusEl = document.getElementById('reset-status');
            const btn = document.getElementById('btn-reset');

            if (!email) return alert('Por favor ingresá tu correo');

            btn.disabled = true;
            btn.innerText = 'Enviando...';

            const redirectUrl = window.location.href.replace('login.html', 'reset-password.html');
            const { error } = await _supabase.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });

            if (error) {
                statusEl.innerText = 'Error: ' + error.message;
                statusEl.className = 'text-xs text-rose-500 font-semibold text-center block';
                btn.disabled = false;
                btn.innerText = 'Enviar Enlace';
            } else {
                statusEl.innerText = '¡Enlace enviado! Revisá tu correo.';
                statusEl.className = 'text-xs text-emerald-400 font-semibold text-center block';
                btn.innerText = 'Enviado';
            }
        });
    </script>
</body>
</html>
