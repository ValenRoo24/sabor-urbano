<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaborUrbano - Nueva Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-orange-500 rounded-2xl flex items-center justify-center text-white font-black text-2xl mx-auto shadow-lg shadow-orange-500/30">
                SU
            </div>
            <h1 class="text-2xl font-bold">Restablecer Contraseña</h1>
            <p class="text-xs text-slate-400">Ingresá tu nueva clave para recuperar el acceso</p>
        </div>

        <form id="reset-form" class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-slate-400 block mb-1">Nueva Contraseña</label>
                <div class="relative">
                    <input type="password" id="new-password" required minlength="6" placeholder="••••••••" class="w-full p-3 rounded-xl border border-slate-700 bg-slate-900 text-sm pl-10 focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                </div>
            </div>

            <p id="status-msg" class="text-xs hidden font-semibold text-center"></p>

            <button type="submit" id="btn-submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
                Guardar Nueva Contraseña
            </button>
        </form>
    </div>

    <script type="module">
        import { AuthService } from './services/authService.js';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const msgEl = document.getElementById('status-msg');
            const btn = document.getElementById('btn-submit');

            btn.disabled = true;
            btn.innerText = 'Actualizando...';

            try {
                await AuthService.updatePassword(newPassword);
                msgEl.innerText = '¡Contraseña actualizada con éxito! Redirigiendo al login...';
                msgEl.className = 'text-xs text-emerald-400 font-semibold text-center block';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (err) {
                msgEl.innerText = 'Error: ' + err.message;
                msgEl.className = 'text-xs text-rose-500 font-semibold text-center block';
                btn.disabled = false;
                btn.innerText = 'Guardar Nueva Contraseña';
            }
        });
    </script>
</body>
</html>
